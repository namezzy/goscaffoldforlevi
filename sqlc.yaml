version: "2"

sql:
  - engine: postgresql
    # The schema is the migration directory itself, not a separate dump. Two
    # sources of truth for the schema is how generated code and the real
    # database drift apart.
    schema: migrations
    queries: queries
    gen:
      go:
        package: db
        out: internal/postgres/db
        sql_package: pgx/v5

        # Generated code is committed and verified in CI (make sqlc-check).
        # Generating at build time would make the build depend on a tool
        # version that is not pinned by go.mod.
        emit_interface: true
        emit_json_tags: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        emit_prepared_queries: false

        overrides:
          # UUIDs are generated in the application (ADR-0007), so they must be
          # a real type on both sides rather than a string that any value fits.
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
