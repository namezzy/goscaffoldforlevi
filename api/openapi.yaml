openapi: 3.1.0

info:
  title: Go Enterprise Scaffold API
  version: 1.0.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    Conventions that apply to every endpoint:

    - Successful responses carry the resource directly, with no envelope. The
      HTTP status code is the envelope (ADR-0004).
    - Failures always use the same wrapper, so a client has one predictable
      place to look when something goes wrong.
    - Updates use PATCH. There is no PUT for resources, because a full
      replacement makes every omitted field a deletion.
    - Rate limit state is advertised on every response through `X-RateLimit-*`,
      except on the login endpoint. There, the headers are stripped: exposing a
      remaining count next to a refused login is both a progress meter for an
      attacker and a contradiction for everyone else. Login carries only
      `Retry-After`.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: auth
    description: |
      Obtaining, rotating and revoking tokens; the security center's
      self-service session list and revocation; and self-service password
      reset. Password reset's two endpoints are unauthenticated by
      necessity, the same as login — a caller requesting or redeeming a
      reset has no session yet.
  - name: users
    description: User records.
  - name: org
    description: |
      The single-tenant organization record and its department tree. Phase 1
      does not support multiple organizations — see ADR context in
      docs/architecture.md — so `/org` always addresses the one company row.
  - name: invitations
    description: |
      Member invitation lifecycle: invite, list, revoke, reinvite and accept.
      Accepting is the one endpoint in this tag that requires no
      authentication — the one-time token is the authorization.
  - name: admin
    description: |
      Operational endpoints for the messaging outbox, dead-letter queue, the
      live request feed and the audit log. Every operation here requires its
      own permission — `messaging:*`, `requests:read` or `audit:read` — which
      only some roles hold; there is no ownership variant, because none of
      this data belongs to a single user.
  - name: tickets
    description: |
      The service-request / ticket workflow: submit, dispatch, process, and
      close. Every role holds `ticket:create`; access to an individual
      ticket beyond that is ownership (the requester, the current assignee)
      or one of the two granular permissions, `ticket:read_all` and
      `ticket:manage` — see each operation's own description for which it
      needs.
  - name: notifications
    description: |
      In-app notifications. Every operation here is implicitly scoped to the
      caller's own account — there is no admin-facing read endpoint, because
      a notification exists for exactly one recipient.
  - name: incidents
    description: |
      The exception/processing center: dead letters merged into triageable
      incidents by fingerprint (consumer + event type), with severity,
      owner, acknowledgement, processing notes and a real (not assumed)
      replay result. Detection and merging run in the background
      (internal/incident.Watcher) — every operation here only ever acts on
      an incident that already exists. Reading requires `incident:read`;
      every mutating operation additionally requires `incident:manage`.
  - name: workbench
    description: |
      The post-login landing screen: a live, permission-scoped summary
      assembled from the ticket, notification, audit and messaging features.
      It owns no data of its own.
  - name: system
    description: Probes used by the orchestrator, outside the versioned API.

paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness and version information
      description: |
        Always answers 200 while the process is running. It is deliberately
        weaker than /ready: a health endpoint that checks dependencies causes
        the orchestrator to restart a healthy pod when a database is slow.
      security: []
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /live:
    get:
      operationId: getLiveness
      tags: [system]
      summary: Liveness probe
      description: |
        Reports whether the process should be restarted. It never checks a
        dependency, because restarting a pod does not fix someone else's
        database.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /ready:
    get:
      operationId: getReadiness
      tags: [system]
      summary: Readiness probe
      description: |
        Reports whether this instance should receive traffic. It checks required
        dependencies and returns 503 while the process is draining, which is
        what lets a load balancer stop sending requests before the socket
        closes.
      security: []
      responses:
        "200":
          description: Ready to serve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: Not ready, or draining.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange credentials for a token pair
      description: |
        Every failure — unknown address, wrong password, disabled account —
        returns the same 401 with the same code and message, and takes the same
        amount of time. Any difference between them would turn this endpoint
        into an account enumeration oracle.

        This endpoint is limited by client address and by a hash of the supplied
        identifier. Both limits must pass. When the limiter's backend is
        unavailable the endpoint fails closed with 503 rather than accepting
        unlimited attempts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated.
          headers:
            Cache-Control:
              description: Always `no-store`; tokens must not be cached.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The credentials were not accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVALID_CREDENTIALS
                  message: invalid credentials
                request_id: 01930f8e-0000-7000-8000-000000000001
        "429":
          $ref: "#/components/responses/RateLimitedLogin"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Rotate a refresh token
      description: |
        Returns a new pair and invalidates the presented token. Presenting a
        token that has already been rotated is treated as evidence that a copy
        exists, and revokes every session descended from the same login — the
        legitimate client included.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The token was invalid, expired, revoked or replayed. The
            response does not distinguish between these.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Revoke a session family
      description: |
        Revokes the presented token and everything rotated from it, which is
        what "log this device out" means.

        Answers 204 whether or not the token existed. Reporting "no such
        session" would let an unauthenticated caller probe which tokens are
        live.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: The session family is revoked, or never existed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a self-service password reset
      description: |
        Answers `202` whether or not `identifier` matches an account, and in
        the same amount of time either way — the caller must not be able to
        tell "an email is on its way" apart from "there is no such account".
        A disabled account is treated the same as no account.

        If a match exists, a one-time reset link is emailed and any earlier
        unconsumed link for the same account stops working — only the most
        recent request's link is ever valid.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPasswordResetRequest"
      responses:
        "202":
          description: Accepted — a reset email was sent if, and only if, the account exists and is active.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [auth]
      summary: Redeem a reset token and set a new password
      description: |
        The token is single-use and expires (`AUTH_PASSWORD_RESET_TTL`,
        1h by default). On success, every session the account holds is
        revoked — see TokenPair's own doc comment on `session_id` for what
        "session" means here — so a stolen password stops working
        immediately even for a device that was already signed in. The
        access token(s) already issued for the account keep working until
        their own natural expiry regardless (at most 1h — see
        docs/architecture.md §10's token invalidation table); nothing can
        shorten that.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPasswordResetRequest"
      responses:
        "204":
          description: The password was changed and every session revoked.
        "400":
          description: |
            The request was malformed, the new password fails the policy,
            or the token is unknown, expired, or already used
            (`PASSWORD_RESET_TOKEN_INVALID`) — these are not distinguished
            from each other.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      summary: List the caller's own sessions
      description: |
        Both currently active sessions and recent history (a revoked or
        expired row stays visible), newest first — this doubles as a
        login-record view: each row already is one login. Capped at the 50
        most recent, not paginated; nobody has more sessions than that.
      responses:
        "200":
          description: The caller's sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The session's UUID.
        schema:
          type: string
          format: uuid

    delete:
      operationId: revokeSession
      tags: [auth]
      summary: Revoke one of the caller's own sessions
      description: |
        "No such session", "already revoked" and "belongs to someone else"
        all answer the same `404` — a caller can never tell a guessed id
        that belongs to another account apart from one that does not exist.
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      tags: [auth]
      summary: "Log out everywhere else: revoke every session but this one"
      responses:
        "200":
          description: How many sessions were revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeOtherSessionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/users:
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user
      description: Requires `user:create`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: The URL of the new user.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            The email address is already registered, or the requested
            username is already taken (`EMAIL_ALREADY_EXISTS` /
            `USERNAME_ALREADY_EXISTS`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

    get:
      tags: [users]
      operationId: listUsers
      summary: List users
      description: |
        Requires `user:list`; there is no self-service variant, because listing
        is inherently an administrative capability.

        Results are ordered by `created_at` descending with `id` as a
        tiebreaker by default. The tiebreaker is not cosmetic: without it, rows
        created in the same instant come back in arbitrary order and a client
        paging through them sees duplicates and gaps.
      parameters:
        - name: page
          in: query
          description: One-based page number. Out-of-range values are clamped.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: |
            Rows per page. Values above the maximum are clamped rather than
            rejected: asking for a thousand rows is reasonable, serving them is
            not.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          description: |
            Case-insensitive substring match against email, username and name.
          schema:
            type: string
        - name: role
          in: query
          description: Restrict to one role.
          schema:
            type: string
            enum: [system_admin, member_admin, operator, read_only, auditor]
        - name: status
          in: query
          description: Restrict to one status.
          schema:
            type: string
            enum: [active, disabled]
        - name: sort
          in: query
          description: Column to sort by.
          schema:
            type: string
            enum: [created_at, name, email]
            default: created_at
        - name: sort_dir
          in: query
          description: |
            Sort direction. Descending is the default, matching the fixed
            order the unfiltered listing always used.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserID"

    get:
      tags: [users]
      operationId: getUser
      summary: Fetch a user
      description: |
        Allowed for the record's owner, or for a caller holding `user:read`.
        Ownership is checked in the service rather than in middleware, because
        the owner is only known once the target is known.
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

    patch:
      tags: [users]
      operationId: updateUser
      summary: Update a user
      description: |
        Omitted fields are left unchanged.

        `email`, `username` and `name` may be changed by the owner. `role`,
        `status`, `department_id` and `clear_department` may not: they
        decide what the account can do, or its standing in the
        organization, so changing them requires `user:update` (or, for
        `role`, `role:assign`) regardless of ownership. Without that split,
        every account would be one request away from being an
        administrator.

        A caller who is not a system administrator, and is not editing
        their own record, additionally cannot change any field on an
        account that currently holds the `system_admin` role, and cannot
        set `role` to `system_admin` on any account (including their own).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The requested email or username is already taken by another
            account (`EMAIL_ALREADY_EXISTS` / `USERNAME_ALREADY_EXISTS`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user
      description: |
        Requires `user:delete`. Ownership is not sufficient: self-deletion is
        irreversible and has not been specified as a product behaviour.
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/users/{id}/password:
    parameters:
      - $ref: "#/components/parameters/UserID"

    put:
      tags: [users]
      operationId: changeUserPassword
      summary: Replace a user's password
      description: |
        Allowed for the owner, or for a caller holding `user:update`.

        It is a separate endpoint rather than a field on PATCH so that the
        plaintext never travels alongside ordinary attributes, where a logged
        request body would expose it.

        PUT rather than PATCH because the password is replaced wholesale; there
        is no partial form of it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: The password was changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/org:
    get:
      tags: [org]
      operationId: getOrganization
      summary: Fetch the company record
      description: Requires `org:read`.
      responses:
        "200":
          description: The organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

    patch:
      tags: [org]
      operationId: updateOrganization
      summary: Update the company record
      description: Requires `org:update`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: The updated organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/org/notification-channels:
    get:
      tags: [org]
      operationId: getNotificationChannels
      summary: Report notification delivery channel status
      description: |
        Requires `org:read`. Deployment-controlled, not part of
        `UpdateOrganizationRequest`: whether a channel is configured depends
        on what the running deployment wires up (e.g. a real email sender in
        `cmd/worker`), not on anything an API client can change.
      responses:
        "200":
          description: Every channel this deployment knows about.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationChannel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/org/departments:
    get:
      tags: [org]
      operationId: listDepartments
      summary: List every department
      description: |
        Requires `department:read`. Not paginated — see queries/org.sql's
        ListDepartments for why: a single-tenant department count is small
        enough that the client builds the tree from this flat list.
      responses:
        "200":
          description: Every department.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

    post:
      tags: [org]
      operationId: createDepartment
      summary: Add a department
      description: Requires `department:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDepartmentRequest"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: The URL of the new department.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The referenced parent department does not exist (`REFERENCE_CONFLICT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/org/departments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The department's UUID.
        schema:
          type: string
          format: uuid

    patch:
      tags: [org]
      operationId: updateDepartment
      summary: Rename or reparent a department
      description: |
        Requires `department:write`. `clear_parent: true` moves the
        department to the top level; omitting it and `parent_id` both leaves
        the parent unchanged, matching PATCH's usual "absent means unchanged"
        rule for every other field here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDepartmentRequest"
      responses:
        "200":
          description: The updated department.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The new parent does not exist, or the change would create a
            cycle in the department tree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

    delete:
      tags: [org]
      operationId: deleteDepartment
      summary: Remove a department
      description: |
        Requires `department:write`. Refused while the department still has
        sub-departments (`DEPARTMENT_HAS_CHILDREN`) or assigned members
        (`DEPARTMENT_HAS_MEMBERS`) — move or clear those first.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The department still has sub-departments or assigned members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/invitations:
    post:
      tags: [invitations]
      operationId: createInvitation
      summary: Invite a member
      description: |
        Requires `invite:create`. Queues the invitation email through the
        same outbox every other asynchronous side effect in this API uses
        (ADR-0009); the response reflects the invitation being recorded, not
        the email having been delivered — see InvitationCreatedPayload's
        documentation in package invite for why delivery status is reported
        separately rather than implied by a 201.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: The URL of the new invitation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

    get:
      tags: [invitations]
      operationId: listInvitations
      summary: List invitations
      description: Requires `invite:read`.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, accepted, expired, revoked]
        - name: email
          in: query
          description: Exact match.
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A page of invitations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/invitations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The invitation's UUID.
        schema:
          type: string
          format: uuid

    get:
      tags: [invitations]
      operationId: getInvitation
      summary: Fetch an invitation
      description: |
        Requires `invite:read`. A still-pending invitation past its
        `expires_at` is reported as `expired` here — the transition is
        discovered lazily, the first time anything looks at the row after
        the deadline, rather than by a background sweep.
      responses:
        "200":
          description: The invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/invitations/{id}/revoke:
    post:
      tags: [invitations]
      operationId: revokeInvitation
      summary: Withdraw a pending invitation
      description: Requires `invite:revoke`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The invitation is no longer pending (`INVITATION_NOT_PENDING`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/invitations/{id}/reinvite:
    post:
      tags: [invitations]
      operationId: reinviteMember
      summary: Revoke and reissue an invitation
      description: |
        Requires `invite:create`. If the existing invitation is still
        pending it is revoked first; a new invitation row is created either
        way, with a fresh token and expiry, to the same email/department/
        role — see invite.Service.Reinvite for why this is a new row rather
        than a mutation of the old one.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: The new invitation.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/invitations/accept:
    post:
      tags: [invitations]
      operationId: acceptInvitation
      summary: Redeem an invitation and provision the account
      description: |
        The one endpoint under this tag — and one of two in the whole API,
        alongside `/auth/login` — that requires no bearer token: the caller
        has no account yet to authenticate as. The one-time token itself is
        the authorization, verified against a still-pending, unexpired
        invitation. The new member logs in afterwards through the normal
        `/auth/login`; this endpoint hands back no session of its own.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "201":
          description: The account was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptInvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No invitation matches this token (`INVITATION_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            The invitation has already been accepted, expired, or was
            revoked (`INVITATION_NOT_PENDING`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/admin/audit:
    get:
      tags: [admin]
      operationId: listAuditEvents
      summary: List audit events
      description: |
        Requires `audit:read`. Every filter is optional and combinable.
      parameters:
        - name: from
          in: query
          description: Inclusive lower bound on `created_at`, RFC 3339.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Inclusive upper bound on `created_at`, RFC 3339.
          schema:
            type: string
            format: date-time
        - name: actor_id
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          description: Exact match, e.g. `member.role_changed`.
          schema:
            type: string
        - name: result
          in: query
          schema:
            type: string
            enum: [success, failure]
        - name: target_type
          in: query
          description: |
            e.g. `user`. Combined with target_id, this is what the member
            detail page uses to show events related to one person rather
            than events they performed.
          schema:
            type: string
        - name: target_id
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A page of audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/admin/audit/{id}:
    get:
      tags: [admin]
      operationId: getAuditEvent
      summary: Fetch one audit event
      description: Requires `audit:read`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The audit event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/admin/outbox/status:
    get:
      tags: [admin]
      operationId: getOutboxStatus
      summary: Report outbox depth and failure counts
      description: |
        The same four numbers `make outbox-status` prints, behind an
        endpoint. Reads the outbox table directly, so it answers even when
        `MESSAGING_ENABLED` is off and nothing is currently being written to
        it — the table still exists once the baseline migrations run.
      responses:
        "200":
          description: Current outbox status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/admin/dlq:
    get:
      tags: [admin]
      operationId: listDeadLetters
      summary: List dead-lettered events awaiting triage
      description: |
        Ordered by `failed_at` descending, matching `make dlq-list`. This is
        a bounded triage queue an operator reads end to end, not a
        paginated resource — there is no `page` parameter, only a `limit`.
      parameters:
        - name: event_type
          in: query
          description: Restrict the list to one event type. Omitted, all types are returned.
          schema:
            type: string
        - name: limit
          in: query
          description: |
            Maximum rows to return. Values above the maximum are clamped
            rather than rejected, matching `page_size` on the user listing.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Outstanding dead letters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeadLetterPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/admin/dlq/{id}/replay:
    post:
      tags: [admin]
      operationId: replayDeadLetter
      summary: Put one dead letter back into the outbox
      description: |
        The event keeps its identity, which is what makes replay safe to
        run twice in a race: any consumer that did manage to process it
        recognises the ID and skips it. A second replay of the same letter
        is rejected with 409, because the letter can only be requeued once.
      parameters:
        - name: id
          in: path
          required: true
          description: The dead letter's own id (not the event id).
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The event was requeued.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This dead letter was already replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/admin/requests:
    get:
      tags: [admin]
      operationId: getRequestFeed
      summary: Recent requests, or a live stream of them
      description: |
        One operation, two shapes, chosen by `Accept`.

        Without `Accept: text/event-stream` this answers immediately with a
        bounded snapshot — the same in-memory ring buffer a live stream
        would tail, read once. That is what lets this operation sit in
        api/bruno's collection at all: a request against it has to complete,
        and a stream by design does not.

        With `Accept: text/event-stream` the connection stays open and one
        `data:` message is sent per request recorded from that point on,
        each carrying the same shape as one item of the snapshot. The server
        ends the stream on its own after the usual request timeout, the same
        as it would end any other handler that ran that long; a client is
        expected to reconnect, and the snapshot on reconnect is what makes
        that loseless enough to not be worth avoiding.

        The buffer is small, in-memory and resets on every deploy — it is a
        "what is happening right now" view, not an audit log or a
        replacement for the Prometheus/Tempo stack in
        deployments/observability.
      responses:
        "200":
          description: |
            A snapshot (`application/json`) or a live stream
            (`text/event-stream`), depending on `Accept`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestEventPage"
            text/event-stream:
              schema:
                type: string
                description: |
                  A sequence of SSE messages, each `data: <RequestEvent
                  JSON>\n\n`, plus periodic `: keep-alive\n\n` comment lines.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/tickets:
    post:
      tags: [tickets]
      operationId: createTicket
      summary: Submit a ticket
      description: Requires `ticket:create`, held by every role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketRequest"
      responses:
        "201":
          description: Created, in status `pending`.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

    get:
      tags: [tickets]
      operationId: listTickets
      summary: List tickets
      description: |
        `scope=mine` (the default) and `scope=assigned` need no permission
        beyond `ticket:create`, held by every role — they are the caller's
        own tickets by construction. `scope=all` requires `ticket:read_all`.
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [mine, assigned, all]
            default: mine
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_progress, needs_info, completed, closed]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, normal, high, urgent]
        - name: search
          in: query
          description: Case-insensitive substring match against title and category.
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at, priority, status]
            default: created_at
        - name: sort_dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A page of tickets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/tickets/overview:
    get:
      tags: [tickets]
      operationId: getTicketStatusOverview
      summary: Ticket counts by status
      description: Requires `ticket:read_all`. Backs the admin workbench's ticket overview card.
      responses:
        "200":
          description: How many tickets are currently in each status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketStatusOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/tickets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [tickets]
      operationId: getTicket
      summary: Fetch one ticket
      description: |
        Access is the requester, the current assignee, or a
        `ticket:read_all` holder.
      responses:
        "200":
          description: The ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/tickets/{id}/activity:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [tickets]
      operationId: getTicketActivity
      summary: Fetch a ticket's timeline
      description: |
        The same access rule as fetching the ticket itself. Backed by
        `audit_events` (`target_type=ticket`) — the same append-only log
        every other feature's history lives in — not a separate table, so
        each entry has the same shape as `AuditEvent`.
      responses:
        "200":
          description: The ticket's timeline, most recent action first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/tickets/{id}/assign:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [tickets]
      operationId: assignTicket
      summary: Dispatch a pending ticket
      description: |
        Requires `ticket:manage`. Only valid from status `pending`; moves
        the ticket to `in_progress`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignTicketRequest"
      responses:
        "200":
          description: The assigned ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/tickets/{id}/reassign:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [tickets]
      operationId: reassignTicket
      summary: Move an already-dispatched ticket to a different assignee
      description: |
        Requires `ticket:manage`. Valid from `in_progress` or `needs_info`;
        does not change status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignTicketRequest"
      responses:
        "200":
          description: The reassigned ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/tickets/{id}/notes:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [tickets]
      operationId: addTicketNote
      summary: Record a processing note
      description: |
        Available to the current assignee or a `ticket:manage` holder, from
        `in_progress` or `needs_info`. Does not change status, but still
        bumps `version` under the same optimistic-concurrency check as every
        other action — see `Ticket.version`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketNoteRequest"
      responses:
        "200":
          description: The ticket, with its version bumped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/tickets/{id}/request-info:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [tickets]
      operationId: requestTicketInfo
      summary: Ask the requester for more information
      description: |
        Available to the current assignee or a `ticket:manage` holder, only
        from `in_progress`; moves the ticket to `needs_info` and notifies
        the requester.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketNoteRequest"
      responses:
        "200":
          description: The ticket, now `needs_info`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/tickets/{id}/provide-info:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [tickets]
      operationId: provideTicketInfo
      summary: Answer a needs_info request
      description: |
        Only the requester may answer. Valid only from `needs_info`; moves
        the ticket back to `in_progress` and notifies the assignee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketNoteRequest"
      responses:
        "200":
          description: The ticket, back to `in_progress`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/tickets/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [tickets]
      operationId: completeTicket
      summary: Mark an in-progress ticket done
      description: |
        Available to the current assignee or a `ticket:manage` holder, only
        from `in_progress`; moves the ticket to `completed` and notifies the
        requester.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteTicketRequest"
      responses:
        "200":
          description: The completed ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/tickets/{id}/close:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [tickets]
      operationId: closeTicket
      summary: End a ticket's lifecycle
      description: |
        The requester may close it once `completed`, confirming the result.
        A `ticket:manage` holder may close it from any non-closed status,
        for example to cancel an invalid request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseTicketRequest"
      responses:
        "200":
          description: The closed ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TicketConflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/incidents:
    get:
      tags: [incidents]
      operationId: listIncidents
      summary: List incidents
      description: Requires `incident:read`.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, acknowledged, resolved]
        - name: severity
          in: query
          schema:
            type: string
            enum: [info, warning, critical]
        - name: owner_id
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: Case-insensitive substring match against event type and consumer.
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A page of incidents, most recently active first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/incidents/summary:
    get:
      tags: [incidents]
      operationId: getIncidentSummary
      summary: Incident counts by severity
      description: Requires `incident:read`. Backs the exception center's summary strip.
      responses:
        "200":
          description: How many non-resolved incidents sit at each severity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/incidents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [incidents]
      operationId: getIncident
      summary: Fetch one incident
      description: Requires `incident:read`.
      responses:
        "200":
          description: The incident.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/incidents/{id}/activity:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [incidents]
      operationId: getIncidentActivity
      summary: Fetch an incident's processing record
      description: |
        Requires `incident:read`. Backed by `audit_events`
        (`target_type=incident`) — the same append-only log every other
        feature's history lives in, not a separate table — so each entry
        has the same shape as `AuditEvent`. Includes both operator actions
        (acknowledge, note, resolve, replay request) and system-detected
        ones (opened, merged, replay result learned), the latter with no
        `actor_id`.
      responses:
        "200":
          description: The incident's processing record, most recent first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/incidents/{id}/severity:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [incidents]
      operationId: setIncidentSeverity
      summary: Re-triage an incident's severity
      description: Requires `incident:manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetIncidentSeverityRequest"
      responses:
        "200":
          description: The updated incident.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/incidents/{id}/owner:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [incidents]
      operationId: assignIncidentOwner
      summary: Assign or clear an incident's owner
      description: Requires `incident:manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignIncidentOwnerRequest"
      responses:
        "200":
          description: The updated incident.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/incidents/{id}/acknowledge:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [incidents]
      operationId: acknowledgeIncident
      summary: Acknowledge an open incident
      description: |
        Requires `incident:manage`. Only valid from status `open`; moves the
        incident to `acknowledged` without resolving it.
      responses:
        "200":
          description: The acknowledged incident.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IncidentConflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/incidents/{id}/notes:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [incidents]
      operationId: addIncidentNote
      summary: Record a processing note
      description: |
        Requires `incident:manage`. Does not change status — the exception
        center's equivalent of a ticket processing note.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentNoteRequest"
      responses:
        "200":
          description: The incident (unchanged status).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/incidents/{id}/resolve:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [incidents]
      operationId: resolveIncident
      summary: Close an incident's triage
      description: |
        Requires `incident:manage`. A later, unrelated recurrence of the
        same fingerprint opens a fresh incident rather than reopening this
        one's history.
      responses:
        "200":
          description: The resolved incident.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IncidentConflict"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/incidents/{id}/replay:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [incidents]
      operationId: requestIncidentReplay
      summary: Submit the incident's underlying dead letter for replay
      description: |
        Requires `incident:manage`. Reuses the existing dead-letter replay
        path (`POST /admin/dlq/{id}/replay`) — this is never a second replay
        implementation. The response's `replay_status` is `pending`:
        submission, not a processed result. The real outcome is learned in
        the background and reflected in a later `GET` of this incident.
      responses:
        "202":
          description: Replay submitted; outcome pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: List the caller's own notifications
      parameters:
        - name: unread_only
          in: query
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: A page of the caller's notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/notifications/unread-count:
    get:
      tags: [notifications]
      operationId: getUnreadNotificationCount
      summary: The caller's unread notification count
      description: What the sidebar badge shows.
      responses:
        "200":
          description: The unread count.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count:
                    type: integer
                    format: int64
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/notifications/{id}/read:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [notifications]
      operationId: markNotificationRead
      summary: Mark one notification read
      description: |
        Scoped to the caller: marking an already-read notification, or one
        that is not the caller's, is not an error — from the caller's point
        of view "this notification is not unread" is already true either
        way, and distinguishing the two would tell an attacker which ids
        exist.
      responses:
        "204":
          description: Marked read (or already was).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      summary: Mark every one of the caller's unread notifications read
      responses:
        "204":
          description: Marked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/dashboard:
    get:
      tags: [workbench]
      operationId: getDashboard
      summary: The caller's workbench overview
      description: |
        Every field is a live call into the feature that owns it — see
        package workbench's doc comment — so there is no windowed metric or
        fabricated trend here, only "as of right now." `admin` is present
        only when the caller holds at least one of the permissions its own
        fields depend on; each of those fields is independently present or
        absent by its own permission, so a role holding only some of them
        still gets the parts it can see.
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A short-lived access token from `/api/v1/auth/login`. It carries the
        subject and role but no personal data, because a JWT is signed rather
        than encrypted and its payload is readable by anyone holding it.

  parameters:
    UserID:
      name: id
      in: path
      required: true
      description: The user's UUID.
      schema:
        type: string
        format: uuid

  schemas:
    User:
      type: object
      description: |
        The public view of a user. The stored password hash is not part of this
        schema and has no representation in the API.
      required: [id, email, name, status, role, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
          description: |
            A second way to log in, alongside email. Absent for an account
            that has never set one — there is no default and none is
            required.
        name:
          type: string
        status:
          type: string
          enum: [active, disabled]
          description: |
            Disabled accounts cannot authenticate. Disabling is preferred to
            deletion because it is reversible.
        role:
          type: string
          enum: [system_admin, member_admin, operator, read_only, auditor]
        department_id:
          type: string
          format: uuid
          description: The organization department this member belongs to. Absent if unassigned.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserPage:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          description: Always an array; an empty page is `[]`, never `null`.
          items:
            $ref: "#/components/schemas/User"
        page_info:
          $ref: "#/components/schemas/PageInfo"

    PageInfo:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          format: int64
        total_pages:
          type: integer

    Organization:
      type: object
      required: [name, identifier, created_at, updated_at]
      properties:
        name:
          type: string
        identifier:
          type: string
          description: |
            A short label for the organization — a slug or short code shown
            alongside its name in settings. May be empty; nothing requires
            one.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateOrganizationRequest:
      type: object
      description: Both fields are optional, but at least one must be present.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        identifier:
          type: string
          maxLength: 100

    NotificationChannel:
      type: object
      required: [name, configured, detail]
      properties:
        name:
          type: string
          example: email
        configured:
          type: boolean
        detail:
          type: string
          description: Human-readable detail on what "configured" means for this channel, or why it is not.

    Department:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parent_id:
          type: string
          format: uuid
          description: Absent for a top-level department.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DepartmentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Always an array; an empty result is `[]`, never `null`.
          items:
            $ref: "#/components/schemas/Department"

    CreateDepartmentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        parent_id:
          type: string
          format: uuid
          description: Omitted for a top-level department.

    UpdateDepartmentRequest:
      type: object
      description: |
        At least one of `name`, `parent_id` or `clear_parent` must have an
        effect.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        parent_id:
          type: string
          format: uuid
        clear_parent:
          type: boolean
          default: false
          description: Moves the department to the top level. Takes precedence over `parent_id`.

    Invitation:
      type: object
      required:
        [id, email, role, status, invited_by, expires_at, created_at, updated_at]
      description: |
        The shape returned by get, list and revoke. Create and reinvite
        answer with CreatedInvitation instead, which adds the one-time
        plaintext token — see that schema for why.
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        department_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [system_admin, member_admin, operator, read_only, auditor]
        status:
          type: string
          enum: [pending, accepted, expired, revoked]
        invited_by:
          type: string
          format: uuid
          description: The inviting member's user id.
        accepted_user_id:
          type: string
          format: uuid
          description: Present once the invitation has been accepted.
        expires_at:
          type: string
          format: date-time
        accepted_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreatedInvitation:
      description: |
        Invitation plus the one-time plaintext token, returned only from
        create and reinvite. It is handed back here, once, because this
        scaffold's only email implementation is a development placeholder
        that logs rather than sends (package notify's LogSender) — without
        this, an invitation would be unredeemable in exactly the environment
        this project ships for. The caller already holds `invite:create`,
        the same trust level cmd/adminctl relies on to print a freshly
        generated password to its own operator once. A production deployment
        with real email delivery can simply have its frontend not display
        the value.
      allOf:
        - $ref: "#/components/schemas/Invitation"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: |
                The invitee's one-time credential. Append it to the
                frontend's accept page as `?token=...` to reproduce the
                emailed link.

    InvitationPage:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
        page_info:
          $ref: "#/components/schemas/PageInfo"

    CreateInvitationRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        department_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [system_admin, member_admin, operator, read_only, auditor]

    AcceptInvitationRequest:
      type: object
      required: [token, name, password]
      properties:
        token:
          type: string
          description: The one-time token from the invitation email's link.
        name:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 12
          maxLength: 128

    AcceptInvitationResponse:
      type: object
      required: [member_id]
      properties:
        member_id:
          type: string
          format: uuid

    AuditEvent:
      type: object
      required: [id, action, target_type, target_id, result, created_at]
      description: |
        Append-only: the database itself refuses UPDATE and DELETE on this
        table (see the org_roles_audit migration), so there is no PATCH or
        DELETE operation for this resource anywhere in this document.
      properties:
        id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
          description: Absent for a system-initiated event, such as a lazily-discovered invitation expiry.
        action:
          type: string
          description: e.g. `member.role_changed`, `invitation.revoked`.
        target_type:
          type: string
          example: user
        target_id:
          type: string
        result:
          type: string
          enum: [success, failure]
        request_id:
          type: string
        before:
          description: |
            A snapshot of only the fields that changed, before the change.
            Never contains a password, token, or other secret content.
        after:
          description: Same shape as `before`, after the change.
        created_at:
          type: string
          format: date-time

    AuditEventPage:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        page_info:
          $ref: "#/components/schemas/PageInfo"

    CreateUserRequest:
      type: object
      required: [email, name, password]
      properties:
        email:
          type: string
          format: email
          description: Normalised to lower case before storage.
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[a-zA-Z][a-zA-Z0-9_-]{2,31}$"
          description: |
            Optional. A second way to log in, alongside email. Must start
            with a letter; the rest may be letters, digits, underscore or
            hyphen.
        name:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: |
            Length is the only rule. Character-class requirements push people
            toward predictable substitutions that add little entropy, while the
            upper bound exists because the hash function processes the whole
            input.
        role:
          type: string
          enum: [system_admin, member_admin, operator, read_only, auditor]
          default: read_only
          description: |
            Optional. Defaults to the least privileged value, so a forgotten
            field cannot create an administrator.

    UpdateUserRequest:
      type: object
      minProperties: 1
      description: |
        At least one field must be present. A patch that changes nothing is a
        client bug, and answering 200 would hide it.

        `email`, `username` and `name` may be changed by the owner. `role`,
        `status`, `department_id` and `clear_department` may not: they
        decide what the account can do, or its standing in the
        organization, so changing them requires `user:update` (or, for
        `role`, `role:assign`) regardless of ownership.

        A caller who is not a system administrator, and is not editing
        their own record, additionally cannot change any field on an
        account that currently holds the `system_admin` role, and cannot
        set `role` to `system_admin` on any account (including their own).
      properties:
        email:
          type: string
          format: email
          description: Normalised to lower case before storage.
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[a-zA-Z][a-zA-Z0-9_-]{2,31}$"
        name:
          type: string
          minLength: 1
          maxLength: 100
        status:
          type: string
          enum: [active, disabled]
        role:
          type: string
          enum: [system_admin, member_admin, operator, read_only, auditor]
          description: Requires `role:assign`, distinct from `user:update` — see PermRoleAssign.
        department_id:
          type: string
          format: uuid
          description: Reassigns the member's department. Requires `user:update`, including on your own record.
        clear_department:
          type: boolean
          default: false
          description: |
            Unassigns the member's department, moving it back to unset.
            Takes precedence over `department_id` — matches
            `clear_parent` on departments themselves.

    ChangePasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 128

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: |
            An email address or a username. Both are accepted in the same
            field: a client asking "email or username?" before it knows
            whether the account exists would already be leaking which one
            that account uses.
        password:
          type: string

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    RequestPasswordResetRequest:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: string
          description: An email address or a username, the same as LoginRequest's.

    ConfirmPasswordResetRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: The one-time token from the reset email's link.
        password:
          type: string
          minLength: 12
          maxLength: 128

    Session:
      type: object
      description: |
        One login on one device — a session family, not an individual
        refresh token. A token is rotated on every use (see RefreshRequest),
        which would otherwise make the same login appear over and over as
        it refreshes; `id` stays the same across every rotation, and is the
        same value TokenPair.session_id hands back at login.
      required: [id, current, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
          description: Whether this is the session the current request is itself authenticated through.
        created_at:
          type: string
          format: date-time
          description: |
            The most recent rotation's timestamp — effectively "last
            active" — not necessarily the original login instant, if the
            session has since refreshed.
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          description: Absent for a still-active session.
        user_agent:
          type: string
          description: Truncated to 256 characters at write time. Absent if the client sent none.
        ip:
          type: string
          description: Absent if it could not be determined.

    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Always an array; an empty list is `[]`, never `null`.
          items:
            $ref: "#/components/schemas/Session"

    RevokeOtherSessionsResponse:
      type: object
      required: [sessions_revoked]
      properties:
        sessions_revoked:
          type: integer
          format: int64

    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, session_id]
      properties:
        access_token:
          type: string
          description: A JWT valid for `expires_in` seconds.
        refresh_token:
          type: string
          description: |
            An opaque high-entropy string. Only its SHA-256 digest is stored, so
            a database leak does not yield usable tokens. It is invalidated by
            the next successful refresh.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: |
            Access token lifetime in seconds, so a client can schedule renewal
            without parsing the token.
        session_id:
          type: string
          format: uuid
          description: |
            Identifies which of the account's sessions this pair belongs to
            — stable across a refresh (rotation keeps the same session), and
            also embedded as the access token's own `jti`. The security
            center's session list uses this to mark the current session
            without decoding the token.

    Ticket:
      type: object
      required:
        [id, title, description, category, priority, status, requester_id, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        category:
          type: string
        priority:
          type: string
          enum: [low, normal, high, urgent]
        status:
          type: string
          enum: [pending, in_progress, needs_info, completed, closed]
        requester_id:
          type: string
          format: uuid
        assignee_id:
          type: string
          format: uuid
          description: Absent until dispatched.
        version:
          type: integer
          description: |
            The optimistic-concurrency token. Every mutating action must
            supply the version it last read as `expected_version`; a stale
            value fails with `409 TICKET_VERSION_CONFLICT` rather than
            silently overwriting a concurrent change.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          description: Present once the ticket reaches status `closed`.

    TicketPage:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          description: Always an array; an empty page is `[]`, never `null`.
          items:
            $ref: "#/components/schemas/Ticket"
        page_info:
          $ref: "#/components/schemas/PageInfo"

    TicketStatusOverview:
      type: object
      required: [counts]
      properties:
        counts:
          type: object
          description: |
            One entry per status currently present — a status with zero
            tickets is simply absent, not present with a zero value.
          additionalProperties:
            type: integer
            format: int64

    CreateTicketRequest:
      type: object
      required: [title, description, category, priority]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 8000
        category:
          type: string
          minLength: 1
          maxLength: 100
        priority:
          type: string
          enum: [low, normal, high, urgent]

    AssignTicketRequest:
      type: object
      required: [assignee_id, expected_version]
      properties:
        assignee_id:
          type: string
          format: uuid
        expected_version:
          type: integer

    TicketNoteRequest:
      type: object
      required: [note, expected_version]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 4000
        expected_version:
          type: integer

    CompleteTicketRequest:
      type: object
      required: [expected_version]
      properties:
        note:
          type: string
          maxLength: 4000
          description: Optional — a straightforward resolution may need no comment beyond the processing notes already on the timeline.
        expected_version:
          type: integer

    CloseTicketRequest:
      type: object
      required: [expected_version]
      properties:
        expected_version:
          type: integer

    Incident:
      type: object
      required:
        [
          id, fingerprint, severity, status, dead_letter_id, event_type, consumer,
          last_error, occurrence_count, first_seen_at, last_seen_at, created_at, updated_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        fingerprint:
          type: string
          description: |
            The merge key, `consumer:event_type`. At most one non-resolved
            incident exists per fingerprint — a repeat failure bumps
            `occurrence_count` on the existing one instead of creating a new
            incident.
        severity:
          type: string
          enum: [info, warning, critical]
          description: |
            Operator-assigned; detection never guesses one. Every new
            incident starts at `warning`.
        status:
          type: string
          enum: [open, acknowledged, resolved]
        owner_id:
          type: string
          format: uuid
          description: Absent until assigned.
        dead_letter_id:
          type: string
          format: uuid
          description: |
            The dead letter behind the most recent occurrence — fetch its
            full payload through `GET /admin/dlq`. Moves to the newest
            occurrence's dead letter on every merge.
        event_type:
          type: string
        consumer:
          type: string
        last_error:
          type: string
          description: The most recent occurrence's error text.
        occurrence_count:
          type: integer
          description: How many dead letters have merged into this incident.
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        acknowledged_at:
          type: string
          format: date-time
        acknowledged_by:
          type: string
          format: uuid
        resolved_at:
          type: string
          format: date-time
        resolved_by:
          type: string
          format: uuid
        replay_status:
          type: string
          enum: [pending, succeeded, failed]
          description: |
            Absent until a replay has been requested. `pending` means
            submitted, not processed — it is never presented as success.
            The real outcome is learned in the background
            (internal/incident.Watcher) and reflected here once known.
        replay_requested_at:
          type: string
          format: date-time
        replay_result_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    IncidentPage:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          description: Always an array; an empty page is `[]`, never `null`.
          items:
            $ref: "#/components/schemas/Incident"
        page_info:
          $ref: "#/components/schemas/PageInfo"

    IncidentSummary:
      type: object
      required: [counts]
      properties:
        counts:
          type: object
          description: |
            Non-resolved incident counts by severity. A severity with zero
            incidents is simply absent, not present with a zero value.
          additionalProperties:
            type: integer
            format: int64

    SetIncidentSeverityRequest:
      type: object
      required: [severity]
      properties:
        severity:
          type: string
          enum: [info, warning, critical]

    AssignIncidentOwnerRequest:
      type: object
      properties:
        owner_id:
          type: string
          format: uuid
          description: Omit or send empty to clear the assignment.

    IncidentNoteRequest:
      type: object
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 4000

    Notification:
      type: object
      required: [id, type, title, body, target_type, target_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          example: ticket_assigned
        title:
          type: string
        body:
          type: string
        target_type:
          type: string
          example: ticket
        target_id:
          type: string
        read_at:
          type: string
          format: date-time
          description: Absent while unread.
        created_at:
          type: string
          format: date-time

    NotificationPage:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          description: Always an array; an empty page is `[]`, never `null`.
          items:
            $ref: "#/components/schemas/Notification"
        page_info:
          $ref: "#/components/schemas/PageInfo"

    DashboardOverview:
      type: object
      required: [my_open_tickets, assigned_to_me, unread_notifications]
      properties:
        my_open_tickets:
          type: integer
          format: int64
          description: |
            Tickets the caller submitted that are not yet completed or
            closed. A current-state count, not windowed.
        assigned_to_me:
          type: integer
          format: int64
          description: The same count, scoped to tickets currently assigned to the caller.
        unread_notifications:
          type: integer
          format: int64
        admin:
          $ref: "#/components/schemas/DashboardAdminOverview"

    DashboardAdminOverview:
      type: object
      description: |
        Present only when the caller holds at least one of the permissions
        its own fields depend on; each field is independently present or
        absent by its own permission.
      properties:
        tickets_by_status:
          description: Present when the caller holds `ticket:read_all`. Same shape as `TicketStatusOverview.counts`.
          type: object
          additionalProperties:
            type: integer
            format: int64
        recent_audit_events:
          description: |
            Present when the caller holds `audit:read`: the 10 most recent
            audit events across every feature, newest first.
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        outbox:
          description: Present when the caller holds `messaging:read`.
          allOf:
            - $ref: "#/components/schemas/OutboxStatus"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                A stable machine-readable identifier. Clients should branch on
                this rather than on the message, which is prose and may change.
            message:
              type: string
              description: Safe to display; never contains internal detail.
            details:
              type: array
              description: Field-level reasons, present on validation failures.
              items:
                type: object
                required: [field, reason]
                properties:
                  field:
                    type: string
                  reason:
                    type: string
        request_id:
          type: string
          description: |
            The only link between what the client saw and what operators can
            look up. Internal errors return nothing else.

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
        version:
          type: string
        commit:
          type: string
          description: |
            The git SHA this binary was built from, injected at link time.
            `unknown` in a binary that was not built through the Makefile or
            the Dockerfile. It identifies a build unambiguously where `version`
            cannot: the version does not move between development builds.

    ReadinessStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
        version:
          type: string
        commit:
          type: string
          description: The git SHA this binary was built from. See HealthStatus.
        components:
          type: object
          additionalProperties:
            type: string

    OutboxStatus:
      type: object
      required: [pending, published, failing, worst_attempts]
      properties:
        pending:
          type: integer
          format: int64
          description: Events not yet delivered.
        published:
          type: integer
          format: int64
          description: |
            Events delivered and still present. Falls as the relay's
            retention sweep prunes them (ADR-0009), so this is a rolling
            count rather than a lifetime total.
        failing:
          type: integer
          format: int64
          description: Pending events that have failed at least once.
        worst_attempts:
          type: integer
          description: The highest attempt count among pending events, 0 if none are failing.

    DeadLetter:
      type: object
      description: A message that exhausted its retries and is parked for triage.
      required:
        [id, event_id, event_type, payload, consumer, attempts, last_error, failed_at]
      properties:
        id:
          type: string
          format: uuid
          description: |
            The dead letter's own id — pass this, not event_id, to the
            replay endpoint. One event can be dead-lettered by two
            different consumers, and "replay the event" would not say
            which of them should run again.
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
        payload:
          description: The event body, unchanged since it was published.
        consumer:
          type: string
          description: Which consumer failed to process this event.
        attempts:
          type: integer
        last_error:
          type: string
          description: Truncated to 1000 characters at write time.
        failed_at:
          type: string
          format: date-time
        replayed_at:
          type: string
          format: date-time
          description: Present once this letter has been requeued. Absent otherwise.

    DeadLetterPage:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          description: |
            Always an array; an empty page is `[]`, never `null`. Bounded by
            `limit` — see the `total` field for how many rows exist beyond
            what is returned here.
          items:
            $ref: "#/components/schemas/DeadLetter"
        total:
          type: integer
          format: int64
          description: |
            How many dead letters match, in total — not `items.length`.
            `items` is truncated to `limit`; `total` is not.

    RequestEvent:
      type: object
      description: |
        One completed HTTP request, reduced to what an operator watching
        live traffic needs. Deliberately carries no request or response
        body — those can contain credentials and personal data, and a live
        feed is exactly the kind of thing whose output ends up on someone's
        screen during a call.
      required: [time, request_id, method, path, status, bytes, duration_ms]
      properties:
        time:
          type: string
          format: date-time
        request_id:
          type: string
        method:
          type: string
        path:
          type: string
        status:
          type: integer
        bytes:
          type: integer
          format: int64
        duration_ms:
          type: number
        ip:
          type: string
          description: |
            The resolved client address (see the `ClientIP` doc comment in
            internal/httpx). Absent when it could not be determined.
        country_code:
          type: string
          description: |
            ISO 3166-1 alpha-2. Absent when unresolved — no GeoIP database
            configured, or no match.
        country_name:
          type: string
          description: |
            Localised label; "内网" for a private or loopback address.
            Absent under the same conditions as `country_code`.

    RequestEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: |
            Oldest first, bounded to the tracker's capacity. Always an
            array; an empty page is `[]`, never `null`.
          items:
            $ref: "#/components/schemas/RequestEvent"

  responses:
    BadRequest:
      description: The request could not be accepted as sent.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: |
        No usable credential was presented. The response never says why a token
        was rejected: distinguishing "expired" from "forged" is useful only to
        someone forging them.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: |
        The caller is authenticated but not permitted. The response does not
        name the missing permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: No such resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    TicketConflict:
      description: |
        Either `expected_version` no longer matches the ticket's current
        version — someone else's action landed first (`TICKET_VERSION_CONFLICT`)
        — or the ticket's current status does not allow this action
        (`TICKET_INVALID_TRANSITION`). Reload the ticket and retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    IncidentConflict:
      description: |
        The incident's current status does not allow this action
        (`INCIDENT_INVALID_TRANSITION`) — for example, acknowledging one
        that is already resolved. Reload the incident and retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    RateLimited:
      description: The caller exceeded its quota.
      headers:
        Retry-After:
          description: Seconds until one more request would be accepted.
          schema:
            type: integer
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          description: Unix timestamp at which the bucket is full again.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    RateLimitedLogin:
      description: |
        Too many login attempts. Unlike other endpoints this response carries
        only `Retry-After`: the remaining-attempts headers would give an
        attacker a precise counter.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unavailable:
      description: |
        A dependency the endpoint cannot proceed without is unavailable. On the
        login path this is deliberate: the rate limiter fails closed there,
        because accepting unlimited attempts while blind would remove
        brute-force protection exactly when it cannot be observed.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

security:
  - bearerAuth: []
