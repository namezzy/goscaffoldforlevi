server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

# Local storage only. This stack is for reading a trace you just produced, not
# for retention: everything is discarded an hour after it arrives, which keeps
# a laptop from filling up with the output of a load test.
compactor:
  compaction:
    block_retention: 1h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
