global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # The API and the worker expose metrics on their own internal ports, not on
  # the public API port. See internal/telemetry/endpoint.go for why.
  - job_name: api
    static_configs:
      - targets: ["host.docker.internal:9464"]
        labels:
          service: go-enterprise-api
  - job_name: worker
    static_configs:
      - targets: ["host.docker.internal:9465"]
        labels:
          service: go-enterprise-worker
