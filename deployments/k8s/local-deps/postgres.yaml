apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: goscaffold-local-deps }
spec:
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: goscaffold-local-deps }
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two PostgreSQL pods would both mount their own
  # emptyDir and answer on the same Service, so a rollout would hand half the
  # connections an empty database.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # Matches the connection string in overlays/local's secretGenerator.
            - { name: POSTGRES_USER,     value: postgres }
            - { name: POSTGRES_PASSWORD, value: postgres }
            - { name: POSTGRES_DB,       value: goscaffold }
            # The data directory must be a subdirectory of the mount, because
            # initdb refuses a directory that already contains lost+found.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec:
              # Naming the database and user matters: pg_isready reports success
              # while the server is still running initdb.
              command: ["pg_isready", "-U", "postgres", "-d", "goscaffold"]
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
      volumes:
        - name: data
          emptyDir: {}
