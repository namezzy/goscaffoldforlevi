# A template, not a Secret. It is committed so that the required keys are
# discoverable; the values are placeholders and every one of them is rejected
# by the application at startup when APP_ENV=production.
#
# Create the real Secret out of band, and never in git:
#
#   kubectl create secret generic goscaffold-secrets \
#     --from-literal=DATABASE_URL='postgres://user:pass@host:5432/goscaffold?sslmode=require' \
#     --from-literal=AUTH_JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=REDIS_PASSWORD='...'
#
# In a cluster with a secrets operator, point that operator at this key list
# instead. The application reads these as ordinary environment variables and
# does not care where they came from.
apiVersion: v1
kind: Secret
metadata:
  name: goscaffold-secrets
  labels:
    app.kubernetes.io/name: goscaffoldforlevi
type: Opaque
stringData:
  # sslmode=require at minimum. A connection string is the single most damaging
  # value here: it carries the credential and the address together.
  DATABASE_URL: postgres://REPLACE_ME:REPLACE_ME@postgres:5432/goscaffold?sslmode=require

  # openssl rand -base64 48. Rotating it invalidates every access token that
  # has already been issued, which logs everyone out; refresh tokens survive,
  # because they are opaque and stored server-side.
  AUTH_JWT_SECRET: REPLACE_ME_WITH_A_GENERATED_SECRET

  REDIS_PASSWORD: REPLACE_ME
