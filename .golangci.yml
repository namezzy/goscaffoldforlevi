# golangci-lint v2 configuration.
#
# The depguard rules below are the important part of this file: they turn the
# dependency direction from ADR-0002 into a build-time failure. A rule that is
# only written in a document is a rule that will be broken.
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - wastedassign

  settings:
    depguard:
      rules:
        # Business packages must not know how they are transported or stored.
        # The point is not purity: it is that a service which imports net/http
        # cannot be reused from a consumer or a CLI, and a service which
        # imports pgx cannot be tested without a database.
        business-layer:
          files:
            - "**/internal/user/*.go"
            - "**/internal/auth/*.go"
            - "!**/internal/user/*_test.go"
            - "!**/internal/auth/*_test.go"
          deny:
            - pkg: "net/http"
              desc: "business logic must not know about HTTP; put handlers in the *http subpackage"
            - pkg: "github.com/go-chi/chi/v5"
              desc: "routing belongs in the *http subpackage"
            - pkg: "github.com/jackc/pgx/v5"
              desc: "database access belongs in the *pg subpackage"
            - pkg: "github.com/redis/go-redis/v9"
              desc: "cache access belongs behind an interface defined by the business package"
            - pkg: "github.com/nats-io/nats.go"
              desc: "messaging belongs behind an interface defined by the business package"
            - pkg: "go.opentelemetry.io/otel"
              desc: "instrumentation belongs in the adapter layers"
            - pkg: "github.com/example/go-enterprise/internal/httpx"
              desc: "the dependency direction is httpx -> business, never the reverse"

        # The transport layer must not reach past the service into the database.
        transport-layer:
          files:
            - "**/internal/httpx/*.go"
            - "**/*http/*.go"
            - "!**/internal/httpx/*_test.go"
          deny:
            - pkg: "github.com/jackc/pgx/v5"
              desc: "handlers must go through a service, not the database"
            - pkg: "github.com/example/go-enterprise/internal/postgres"
              desc: "handlers must go through a service, not the connection pool"

        # Anything can be imported from main; that is what a composition root is
        # for. This rule exists to keep the deprecated packages out everywhere.
        all:
          files:
            - "$all"
          deny:
            - pkg: "github.com/pkg/errors"
              desc: "use the standard library errors package with %w"
            - pkg: "io/ioutil"
              desc: "deprecated; use io and os"
            - pkg: "math/rand"
              desc: "use math/rand/v2, or crypto/rand for anything security-related"

    exhaustive:
      # An unhandled Kind must be a compile-time conversation, not a surprise.
      default-signifies-exhaustive: true

    errcheck:
      check-type-assertions: true

    gosec:
      excludes:
        # G104 duplicates errcheck.
        - G104

    govet:
      # fieldalignment is deliberately not enabled: readable grouping of
      # configuration structs is worth more than a few bytes per process.
      enable-all: false

    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: indent-error-flow

  exclusions:
    rules:
      # Tests legitimately ignore errors, use fixed credentials, build
      # requests without a context, and contain deliberate misspellings.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - contextcheck
          - noctx
          - misspell

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/example/go-enterprise
