# Image build and publish.
#
# Runs after the code is already on master or tagged, so it does not repeat the
# CI gate. It is separate from ci.yml because it needs write permission on the
# package registry, and a workflow that pull requests can trigger should never
# hold that.
name: Docker

on:
  push:
    branches: [master]
    tags: ["v*"]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push (${{ matrix.target }})
    runs-on: ubuntu-latest

    # The two images share every layer up to the final copy, but they are built
    # as separate jobs so that a failure names which one broke.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
            suffix: ""
          - target: worker
            suffix: "-worker"
          # The migration image is referenced by base/migrate-job.yaml. Leaving
          # it unpublished is invisible until a real deployment, where the Job
          # sits in ImagePullBackOff and the release stops before the schema
          # moves. deployments/k8s/manifests_test.go now fails instead.
          - target: migrate
            suffix: "-migrate"
          # Not referenced by any manifest: it is run once, by hand, to create
          # the first administrator. It is published because there is otherwise
          # no way to do that inside a cluster at all.
          - target: adminctl
            suffix: "-adminctl"

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag policy (Phase 6 decision D6):
      #
      #   sha-<commit>  every build, immutable, the only tag a manifest may use
      #   v1.2.3        exact release
      #   v1.2, v1      moving tags, for a human trying a release by hand
      #
      # The moving tags are produced because section 6.7 asks for them, but they
      # must never appear in a Kubernetes manifest: they make the same YAML
      # deploy different code at different times, and that drift leaves no
      # trace anywhere.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0-master.{0}', github.sha) }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
